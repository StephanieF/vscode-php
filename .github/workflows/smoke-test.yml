name: Smoke test wrapper scripts

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unix:
    # No GitHub-hosted macOS runner supports Docker (no nested virtualization),
    # so this is the closest available proxy for php-unix on Mac: it's the same
    # script and the same $HOME/$PWD semantics, just exercised on Linux.
    name: php-unix (Linux / Mac proxy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make wrapper executable
        run: chmod +x php-unix

      - name: php -v works and reports the expected version
        run: ./php-unix -v | grep -q 'PHP 8.4'

      - name: $HOME is actually mounted into the container
        run: |
          marker="$HOME/ci-smoke-marker-$$"
          echo hello > "$marker"
          "$GITHUB_WORKSPACE/php-unix" -r '
            if (!file_exists($argv[1])) {
              fwrite(STDERR, "home mount failed: " . $argv[1] . PHP_EOL);
              exit(1);
            }
            echo "home mount ok" . PHP_EOL;
          ' "$marker"
          rm "$marker"

      - name: Current directory is mounted at /code and used as the workdir
        run: |
          workdir=$(mktemp -d)
          cd "$workdir"
          echo '<?php echo getcwd(), PHP_EOL;' > check.php
          out=$("$GITHUB_WORKSPACE/php-unix" check.php)
          if [ "$out" != "/code" ]; then
            echo "expected cwd /code, got '$out'" >&2
            exit 1
          fi

  windows:
    name: php-windows.cmd
    runs-on: windows-latest
    # windows-latest ships plain Docker Engine (Moby) defaulted to Windows
    # containers; the php image is Linux-based, so this job installs Docker
    # Desktop for a real Linux-container engine. That install + startup is
    # slow and occasionally flaky on hosted Windows runners — this timeout
    # keeps a hang from burning CI minutes indefinitely.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Desktop
        shell: pwsh
        run: choco install docker-desktop --no-progress -y

      - name: Start Docker Desktop and wait for its Linux engine to be ready
        shell: pwsh
        run: |
          Start-Process "C:\Program Files\Docker\Docker\Docker Desktop.exe"
          $deadline = (Get-Date).AddMinutes(10)
          while ($true) {
            $osType = docker info --format '{{.OSType}}' 2>$null
            if ($LASTEXITCODE -eq 0 -and $osType -eq 'linux') {
              Write-Host "Docker ready (OSType=$osType)"
              break
            }
            if ((Get-Date) -ge $deadline) {
              Write-Error "Docker Desktop did not report a Linux engine within 10 minutes (last OSType: '$osType')"
              exit 1
            }
            Start-Sleep -Seconds 5
          }

      - name: php -v works and reports the expected version
        shell: pwsh
        run: |
          # `& cmd` returns multi-line output as a string array, and -match /
          # -notmatch against an array filters elements rather than returning
          # a bool — joining to a single string first avoids that trap.
          $out = (& "$env:GITHUB_WORKSPACE\php-windows.cmd" -v) -join "`n"
          if ($out -notmatch 'PHP 8\.4') {
            Write-Error "unexpected version output: $out"
            exit 1
          }

      - name: '%USERPROFILE% is actually mounted into the container'
        shell: pwsh
        run: |
          $marker = Join-Path $env:USERPROFILE "ci-smoke-marker-$PID.txt"
          Set-Content -Path $marker -Value "hello"
          $containerPath = "/home/$env:USERNAME/ci-smoke-marker-$PID.txt"
          & "$env:GITHUB_WORKSPACE\php-windows.cmd" -r "if (!file_exists('$containerPath')) { fwrite(STDERR, 'home mount failed: $containerPath' . PHP_EOL); exit(1); } echo 'home mount ok' . PHP_EOL;"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item $marker

      - name: Current directory is mounted at /code and used as the workdir
        shell: pwsh
        run: |
          $workdir = Join-Path $env:RUNNER_TEMP "smoke-cwd"
          New-Item -ItemType Directory -Path $workdir | Out-Null
          Set-Location $workdir
          Set-Content -Path check.php -Value '<?php echo getcwd(), PHP_EOL;'
          $out = ((& "$env:GITHUB_WORKSPACE\php-windows.cmd" check.php) -join "`n").Trim()
          if ($out -ne '/code') {
            Write-Error "expected cwd /code, got '$out'"
            exit 1
          }
